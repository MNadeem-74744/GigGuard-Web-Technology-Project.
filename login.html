{% extends "base.html" %}
{% block title %}Sign in – GigGuard{% endblock %}
{% block content %}
<main id="login" class="view on">
 <div class="card" style="max-width:440px;margin:auto">
  <h2 id="lt">Sign in</h2>
  <form id="lf" method="post" action="{{ url_for('login') }}">
   <div id="nm" hidden><label for="n">Full name</label><input id="n" name="full_name" autocomplete="name"></div>
   <label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="email">
   <label for="p">Password</label><input id="p" name="password" type="password" minlength="8" required autocomplete="current-password">
   <p class="muted" style="margin-top:8px;font-size:.9rem">Use at least 8 characters.</p>
   <button class="btn" style="width:100%" id="lb">Sign in</button>
  </form>
  <p style="margin:18px 0 0;text-align:center"><a href="{{ url_for('login') }}" id="sw" data-login="{{ url_for('login') }}" data-register="{{ url_for('register') }}">New here? Create an account</a></p>
 </div>
</main>
{% endblock %}
